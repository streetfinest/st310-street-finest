name: ST310 V3.3 branch preflight tests

on:
  push:
    branches: [v3.3-prep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test V3.3 API with temporary database (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out uploaded branch
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies and HTTP test client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'httpx>=0.27,<1'
      - name: Verify V3.3 using isolated test database
        run: python tests/test_v33_preflight.py
